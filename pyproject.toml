[project]
name = "nb-nebi-kernels"
dynamic = ["version"]
description = "Jupyter KernelSpecManager that discovers kernels from nebi-tracked pixi workspaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OpenTeams" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ipykernel>=6.0.0",
    "jupyter_client>=8.0.0",
    "jupyter_core>=5.0.0",
    "jupyter_server>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/nebari-dev/nb-nebi-kernels"
Repository = "https://github.com/nebari-dev/nb-nebi-kernels"

[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs", "hatch-jupyter-builder>=0.5", "jupyterlab>=4.0.0,<5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/nb_nebi_kernels/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nb_nebi_kernels"]

[tool.hatch.build.targets.wheel.shared-data]
"src/nb_nebi_kernels/jupyter-config/jupyter_server_config.d/nb_nebi_kernels.json" = "etc/jupyter/jupyter_server_config.d/nb_nebi_kernels.json"
"src/nb_nebi_kernels/labextension" = "share/jupyter/labextensions/nb-nebi-kernels"
"install.json" = "share/jupyter/labextensions/nb-nebi-kernels/install.json"

[tool.hatch.build.targets.sdist]
artifacts = ["src/nb_nebi_kernels/labextension"]
exclude = [".github", "experiment", "docs"]

# Build the federated labextension when building a wheel/sdist. skip-if-exists
# short-circuits when the bundle is already built (shipped in the sdist, or
# built via `pixi run -e e2e build-labext`), so repeat builds don't rebuild it.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/nb_nebi_kernels/labextension/static/style.js",
    "src/nb_nebi_kernels/labextension/package.json",
]
skip-if-exists = ["src/nb_nebi_kernels/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "src/nb_nebi_kernels/labextension"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
nb-nebi-kernels = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.6.0"
mypy = ">=1.11.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"

[tool.pixi.feature.e2e.dependencies]
jupyterlab = ">=4.0.0"
ipykernel = ">=6.0.0"
pixi = "*"
# Node for the labextension build (jlpm/webpack). Any maintained LTS works —
# verified on Node 20, 22 and 25. The real build constraint is webpack,
# pinned via package.json "resolutions"; Node version is not the issue.
nodejs = "22.*"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
e2e = { features = ["e2e"], solve-group = "default" }

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", depends-on = [] }
test-cov = { cmd = "pytest --cov=src/nb_nebi_kernels --cov-report=term-missing", depends-on = [] }

[tool.pixi.feature.lint.tasks]
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"

[tool.pixi.feature.e2e.tasks]
# Copy jupyter config for editable installs (shared-data is wheel-only)
dev-enable = "cp src/nb_nebi_kernels/jupyter-config/jupyter_server_config.d/nb_nebi_kernels.json $CONDA_PREFIX/etc/jupyter/jupyter_server_config.d/nb_nebi_kernels.json"
lab = "jupyter lab --ServerApp.kernel_spec_manager_class=nb_nebi_kernels.NebiKernelSpecManager"
# Build the federated labextension into src/nb_nebi_kernels/labextension/
build-labext = "jlpm install && jlpm build:prod"
# Rebuild on source changes (pair with `jupyter labextension develop`)
watch-labext = "jlpm watch"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/nb_nebi_kernels"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
